name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testar:
    name: Backup e Java
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar os testes
        run: ./testar.sh
